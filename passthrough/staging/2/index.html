<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery MR - Meta Quest 3S</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            color: #fff;
            overflow: hidden;
        }

        #container { width: 100vw; height: 100vh; }

        #startScreen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            z-index: 1000;
            padding: 20px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 0.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1.2em;
            margin-bottom: 1.5em;
            text-align: center;
            max-width: 600px;
        }

        button {
            padding: 20px 40px;
            font-size: 1.5em;
            background: #ec4899;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }

        button:hover {
            background: #db2777;
            transform: scale(1.05);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 900;
        }

        #controls.active { display: flex; }

        #controls button {
            padding: 12px 20px;
            font-size: 1em;
            background: rgba(236, 72, 153, 0.9);
            border-radius: 8px;
        }

        #photoInfo {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 10px;
            z-index: 850;
            display: none;
            max-width: 350px;
        }

        #photoInfo.active { display: block; }

        #photoInfo h4 {
            color: #ec4899;
            margin-bottom: 10px;
        }

        #photoInfo p {
            margin: 5px 0;
            color: #ccc;
            font-size: 0.9em;
        }

        #gallery {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 10px;
            z-index: 800;
            display: none;
            max-width: 300px;
            max-height: 80vh;
            overflow-y: auto;
        }

        #gallery.active { display: block; }

        #gallery h3 {
            color: #ec4899;
            margin-bottom: 10px;
        }

        .photo-item {
            background: rgba(236, 72, 153, 0.2);
            margin: 8px 0;
            padding: 10px;
            border-radius: 5px;
            border-left: 3px solid #ec4899;
            cursor: pointer;
        }

        .photo-item:hover {
            background: rgba(236, 72, 153, 0.3);
        }

        .photo-item h4 {
            margin: 0 0 5px 0;
            color: #fff;
        }

        .photo-item p {
            margin: 2px 0;
            font-size: 0.85em;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>📸 Photo Gallery MR</h1>
        <p>Experience your memories in mixed reality with sliding photo frames that display captured moments in HUD bubbles.</p>
        <button id="startButton">Enter Gallery Mode</button>
        <p id="statusText" style="margin-top: 20px; font-size: 0.9em;">Checking WebXR support...</p>
    </div>

    <div id="container"></div>

    <div id="controls">
        <button id="captureButton">📷 Capture Photo</button>
        <button id="toggleGallery">🖼️ Gallery</button>
        <button id="toggleInfo">ℹ️ Info</button>
        <button id="exitButton">🚪 Exit</button>
    </div>

    <div id="gallery">
        <h3>🖼️ Photo Gallery</h3>
        <div id="galleryContent"></div>
    </div>

    <div id="photoInfo">
        <h4>📊 Gallery Stats</h4>
        <p>Total Photos: <span id="totalPhotos">0</span></p>
        <p>Session Photos: <span id="sessionPhotos">0</span></p>
        <p>Active Frames: <span id="activeFrames">0</span></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" 
            integrity="sha384-OLBgp1GsljhM2TJ+sbHjaiH9txEUvgdDTAzHv2P24donTt6/529l+9Ua0vFImLlb" 
            crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
